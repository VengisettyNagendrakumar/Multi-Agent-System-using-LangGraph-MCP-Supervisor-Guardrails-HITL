name: Keep Render service awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          if [ -z "$RENDER_APP_URL" ]; then
            echo "Set the RENDER_APP_URL repository secret first." >&2
            exit 1
          fi

          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 15 \
            --retry-connrefused \
            --retry-max-time 180 \
            --max-time 60 \
            "${RENDER_APP_URL%/}/health"
