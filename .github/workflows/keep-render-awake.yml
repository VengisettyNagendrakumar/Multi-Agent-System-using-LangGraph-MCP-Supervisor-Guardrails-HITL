name: Keep Render service awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render health endpoint
        env:
          RENDER_APP_URL: https://multi-agent-system-using-langgraph-mcp-cswl.onrender.com
        run: |
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 15 \
            --retry-connrefused \
            --retry-max-time 180 \
            --max-time 60 \
            "${RENDER_APP_URL%/}/health"
